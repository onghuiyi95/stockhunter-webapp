<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>StockHunter WebApp (纯前端还原版 v2)</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.2.0/crypto-js.min.js"></script>
<style>
  *{box-sizing:border-box}
  body{font-family:-apple-system,Segoe UI,Arial,sans-serif;margin:0;background:#eef1f4;color:#222}
  header{background:#0e6e7d;color:#fff;padding:10px 16px;font-size:18px;font-weight:700;display:flex;justify-content:space-between;align-items:center}
  header a{color:#fff;font-size:13px;text-decoration:none;background:rgba(255,255,255,.2);padding:4px 10px;border-radius:4px}
  .tabs{display:flex;flex-wrap:wrap;background:#0e6e7d;padding:0 8px}
  .tabs button{background:none;border:none;color:#cdeef3;padding:10px 14px;cursor:pointer;font-size:14px;border-bottom:3px solid transparent}
  .tabs button.active{color:#fff;border-bottom-color:#ffd34d;font-weight:700}
  main{padding:16px;max-width:1100px;margin:0 auto}
  .panel{display:none}.panel.active{display:block}
  .loading{color:#888;padding:20px}
  table{width:100%;border-collapse:collapse;background:#fff;font-size:13px;margin-top:8px}
  th,td{border:1px solid #e1e4e8;padding:6px 8px;text-align:left}
  th{background:#f0f3f5}
  .up{color:#1a7f4b}.down{color:#c0392b}
  .card{background:#fff;border:1px solid #e1e4e8;border-radius:6px;padding:10px 12px;margin:8px 0;box-shadow:0 1px 2px rgba(0,0,0,.05)}
  .tag{display:inline-block;padding:1px 7px;border-radius:3px;font-size:11px;margin:1px;color:#fff}
  .tag.b{background:#8e44ad}.tag.g{background:#27ae60}.tag.o{background:#e67e22}.tag.y{background:#f1c40f;color:#333}.tag.bl{background:#2980b9}
  input,select{padding:5px 8px;border:1px solid #ccc;border-radius:4px;font-size:13px}
  button.go{background:#0e6e7d;color:#fff;border:none;padding:6px 12px;border-radius:4px;cursor:pointer}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
  .stat{background:#fff;border:1px solid #e1e4e8;border-radius:6px;padding:10px;text-align:center}
  .stat .n{font-size:22px;font-weight:800}
  iframe{border:1px solid #ddd;width:100%;height:520px;background:#fff}
  .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
</style>
</head>
<body>
<header>
  <span>📈 StockHunter WebApp</span>
  <a href="feature-checklist.html">功能清单</a>
</header>
<div class="tabs" id="tabs"></div>
<main>
  <!-- 个股 -->
  <section class="panel" id="p-stock">
    <div class="row">
      <input id="stock-code" placeholder="代码 如 1155" value="1155" size="10">
      <button class="go" onclick="loadStock()">查询个股</button>
      <span id="stock-name" style="font-weight:700;color:#0e6e7d"></span>
    </div>
    <div class="row">
      <button class="go" onclick="loadFundamental()">FUNDAMENTAL</button>
      <button class="go" onclick="loadTechnical()">TECHNICAL</button>
      <button class="go" onclick="loadQResult()">Q-RESULT</button>
      <button class="go" onclick="loadDividend()">DIVIDEND</button>
      <button class="go" onclick="loadWarrant()">WARRANT</button>
      <button class="go" onclick="loadStockNews()">NEWS</button>
      <button class="go" onclick="loadAdam()">ADAM图表</button>
    </div>
    <div id="stock-body" class="loading">输入代码查询…</div>
  </section>

  <!-- 行情/榜单 -->
  <section class="panel" id="p-market">
    <div class="row">
      <button class="go" onclick="cacheList('1','Overview 市场统计')">Overview</button>
      <button class="go" onclick="cacheList('26','Top Gainer(额)')">Top Gainer</button>
      <button class="go" onclick="cacheList('27','Top Loser')">Top Loser</button>
      <button class="go" onclick="cacheList('28','Top Gain %')">Top Gain%</button>
      <button class="go" onclick="cacheList('29','Top Lose %')">Top Lose%</button>
    </div>
    <div id="market-body" class="loading"></div>
  </section>

  <!-- 热门 -->
  <section class="panel" id="p-hot">
    <div class="row">
      <select id="hot-day"><option value="1">DAY</option><option value="7">WEEK</option><option value="30">MONTH</option></select>
      <button class="go" onclick="loadHot()">加载热门</button>
    </div>
    <div id="hot-body" class="loading"></div>
  </section>

  <!-- 指数 -->
  <section class="panel" id="p-index">
    <div class="row">
      <select id="idx-region"><option value="ASIA">ASIA</option><option value="WORLD">WORLD</option><option value="ASEAN">ASEAN</option><option value="index">MALAYSIA</option></select>
      <button class="go" onclick="loadIndex()">加载指数</button>
    </div>
    <div id="index-body" class="loading"></div>
  </section>

  <!-- 新闻 -->
  <section class="panel" id="p-news">
    <div class="row">
      <select id="news-kind"><option value="news">Economic/个股</option><option value="social">Social</option></select>
      <input id="news-stk" placeholder="个股代码(留空=全局)" size="10">
      <button class="go" onclick="loadNews()">加载新闻</button>
    </div>
    <div id="news-body" class="loading"></div>
  </section>

  <!-- 选股 -->
  <section class="panel" id="p-screener">
    <div class="filters">
      <fieldset><legend>SA 信号</legend>
        <label>Breakout 突破 <input type="checkbox" id="f-bo"></label>
        <label>YearHigh 年高 <input type="checkbox" id="f-yh"></label>
        <label>TopProfit 最高盈利 <input type="checkbox" id="f-tp"></label>
        <label>GoldenCross 金叉 <input type="checkbox" id="f-gw"></label>
        <label>NetCash 净现金 <input type="checkbox" id="f-nc"></label>
        <label>Warrant 权证 <input type="checkbox" id="f-iw"></label>
        <label>TopRevenue 最高营收 <input type="checkbox" id="f-tr"></label>
        <label>EarningRecovery <input type="checkbox" id="f-hl"></label>
        <label>Earning <input type="checkbox" id="f-er"></label>
        <label>Report <select id="f-report"><option value="">-</option><option>1</option><option>4</option><option>7</option><option>10</option></select></label>
        <label>Trend <select id="f-trend"><option value="">-</option><option value="5">5 Star</option></select></label>
        <label>TrendDay &lt; <input id="f-trendday" size="4" placeholder="9"></label>
        <label>Sector <input id="f-sector" placeholder="如 CONSUMER" size="14"></label>
        <label>股价 <input id="f-pmin" placeholder="min" size="5"> - <input id="f-pmax" placeholder="max" size="5"></label>
      </fieldset>
      <fieldset><legend>FA 基本面</legend>
        <label>PE &lt; <input id="f-pe" size="6" placeholder="10"></label>
        <label>ProfitMargin &gt; <input id="f-pm" size="6" placeholder="10"></label>
        <label>EV/EBIT &lt; <input id="f-ev" size="6" placeholder="10"></label>
        <label>Debt/Cash &lt; <input id="f-dc" size="6" placeholder="1"></label>
        <label>CurrentRatio &gt; <input id="f-cr" size="6" placeholder="2"></label>
        <label>EarningYield &gt; <input id="f-ey" size="6" placeholder="10"></label>
        <label>ROE &gt; <input id="f-roe" size="6" placeholder="10"></label>
        <label>DivYield &gt; <input id="f-dy" size="6" placeholder="3"></label>
        <label>Price/Book &lt; <input id="f-pob" size="6" placeholder="1.5"></label>
        <label>EV(M) &lt; <input id="f-evalue" size="8" placeholder="500"></label>
        <label>MktCap(M) <input id="f-mcapmin" size="6" placeholder="0"> - <input id="f-mcapmax" size="8" placeholder="2000"></label>
        <label>TotalShare(M) <input id="f-tsmin" size="6" placeholder="0"> - <input id="f-tsmax" size="8" placeholder="500"></label>
      </fieldset>
      <fieldset><legend>TA 技术</legend>
        <label>MA1 <input id="f-ma1" size="6" placeholder="如 0"></label>
        <label>MA1类型 <select id="f-mac1"><option value="">-</option><option>Price</option><option>EMA10</option><option>EMA20</option><option>EMA25</option><option>EMA50</option><option>SMA10</option><option>SMA20</option><option>SMA60</option><option>SMA200</option></select></label>
        <label>MA2 <input id="f-ma2" size="6"></label>
        <label>MA2类型 <select id="f-mac2"><option value="">-</option><option>Price</option><option>EMA10</option><option>EMA20</option><option>EMA25</option><option>EMA50</option><option>SMA10</option><option>SMA20</option><option>SMA60</option><option>SMA200</option></select></label>
        <label>MA3 <input id="f-ma3" size="6"></label>
        <label>MACD <input id="f-macd" size="6"></label>
        <label>MACD天数 <input id="f-macdday" size="4"></label>
        <label>RSI条件 <input id="f-rsic" size="4"></label>
        <label>RSI值 <input id="f-rsiv" size="6"></label>
        <label>OBV <input id="f-obv" size="6"></label>
        <label>布林 <input id="f-bb" size="6"></label>
        <label>布林天数 <input id="f-bbday" size="4"></label>
        <label>换手min <input id="f-tomin" size="6"></label>
        <label>换手max <input id="f-tomax" size="6"></label>
      </fieldset>
      <fieldset><legend>CA K线形态</legend>
        <label><input type="checkbox" id="f-ca-hammer"> Hammer</label>
        <label><input type="checkbox" id="f-ca-harami"> Harami</label>
        <label><input type="checkbox" id="f-ca-haramicross"> HaramiCross</label>
        <label><input type="checkbox" id="f-ca-engulfing"> Engulfing</label>
        <label><input type="checkbox" id="f-ca-piercing"> Piercing</label>
        <label><input type="checkbox" id="f-ca-dojistar"> DojiStar</label>
        <label><input type="checkbox" id="f-ca-dragonflydoji"> DragonflyDoji</label>
        <label><input type="checkbox" id="f-ca-marubozu"> Marubozu</label>
        <label><input type="checkbox" id="f-ca-invertedhammer"> InvertedHammer</label>
        <label><input type="checkbox" id="f-ca-takuri"> Takuri</label>
        <label><input type="checkbox" id="f-ca-morningstar"> MorningStar</label>
        <label><input type="checkbox" id="f-ca-morningdojistar"> MorningDojiStar</label>
        <label><input type="checkbox" id="f-ca-tristar"> TriStar</label>
        <label><input type="checkbox" id="f-ca-kicking"> Kicking</label>
        <label><input type="checkbox" id="f-ca-tasukigap"> TasukiGap</label>
        <label><input type="checkbox" id="f-ca-abandonbaby"> AbandonBaby</label>
        <label><input type="checkbox" id="f-ca-threelinestrike"> ThreeLineStrike</label>
        <label><input type="checkbox" id="f-ca-threeoutside"> ThreeOutside</label>
        <label><input type="checkbox" id="f-ca-threewhitesoldiers"> ThreeWhiteSoldiers</label>
      </fieldset>
      <button class="go" onclick="loadScreener()">选股 (SA/FA/TA/CA)</button>
    </div>
    <div id="screener-body" class="loading"></div>
  </section>

  <!-- 策略 -->
  <section class="panel" id="p-strategy">
    <div id="strategy-body"></div>
  </section>

  <!-- 图表 -->
  <section class="panel" id="p-chart">
    <div class="row">
      <select id="chart-type"><option value="adam">ADAM</option><option value="mom">板块动量</option><option value="happy">Happy/Panic</option></select>
      <input id="chart-code" placeholder="ADAM需代码" size="10" value="1155">
      <button class="go" onclick="loadChart()">加载图表</button>
    </div>
    <div id="chart-body"><iframe id="chart-iframe"></iframe></div>
  </section>
</main>

<script>
// ===== 配置 =====
const PROXY = "https://proxy2.2allanng.workers.dev/?url="; // 用户的 Cloudflare Worker 代理
const ORIGIN = "https://stockhunter.netlify.app";
const KEY = CryptoJS.enc.Utf8.parse("Kls3@p#GI3ch!qEh");
const IVZ = CryptoJS.lib.WordArray.create([0,0,0,0]); // 16 zero bytes (AES block = 4 words of 32-bit = 16 bytes)

function aesEncrypt(plain){
  const pt = CryptoJS.enc.Utf8.parse(plain);
  const ct = CryptoJS.AES.encrypt(pt, KEY, {iv:IVZ, mode:CryptoJS.mode.CBC, padding:CryptoJS.pad.Pkcs7});
  return ct.toString(); // Base64 (crypto-js 默认输出即 Base64)
}
function today(){ const d=new Date(); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
function shUrl(base, params, enc=true){
  const hash = enc ? aesEncrypt(params) : params;
  return base + "?" + (enc?"hash="+encodeURIComponent(hash)+"&os=and":"id="+hash);
}
async function getJSON(targetUrl){
  const r = await fetch(PROXY + encodeURIComponent(targetUrl), {headers:{"User-Agent":"Mozilla/5.0","Origin":ORIGIN}});
  return await r.json();
}
const pct = v => v==null?'':(v>0?'<span class="up">+'+v+'</span>':'<span class="down">'+v+'</span>');
const arr = d => Array.isArray(d)?d : (d&&d.result_value)?d.result_value : (d&&Array.isArray(d.data)?d.data:[]);

// ===== 策略页 (来自 App Strategy List 的 6 个 Google Slides) =====
const STRATS = [
  ["Growth","盈利增长策略","按公司盈利增长的 3 种方式筛选：ConQ(连续季度增长) / QoQ(环比) / YoY(同比)。好公司通过业务扩张、成本节约提升盈利→股价通常随之增长。","json_cache_v1.php?id=11/12/13"],
  ["Sector","板块策略","基于 Bursa 官方板块分类选股：Construction / Consumer Products / Finance / Plantation / Properties 等。在某一板块内选龙头或低估股。","json_cache_v2.php?id=33 (+id=34&sector=)"],
  ["Trend","趋势策略(星级)","用星级表示趋势：5=牛市上涨(股价>20MA&60MA) / 4=上涨 / 3=牛休整 / 2=底部反转 / 1=下跌。5星为强牛。","json_cache_v1.php?id=6&trend=2..5"],
  ["Report","季报策略","按财报月分组(1~12月)，分3类：Jan/Apr/Jul/Oct、Feb/May/Aug/Nov、Mar/Jun/Sep/Dec。聪明钱常在季报前提前布局。","json_cache_v1.php?id=16&type=1/2/3"],
  ["Hot","热门策略","高成交量=大量资金进出，可能机会也可能风险。买卖交易形成价量波动；内幕交易可能预示方向。","getklse_hotstk_v1 (DAY/WEEK/MONTH)"],
  ["Top","榜首策略","按榜首类型筛选：TopProfit(季报利润新高) / Top Dividend(最高股息) / Top Net Cash(净现金最高) / Top Loss(亏损榜,避坑)。","json_cache_v1.php?id=17/18/22/43"],
];
function renderStrategy(){
  const el=document.getElementById('strategy-body');
  let h='<h2 style="color:#0e6e7d">📘 StockHunter 策略列表 (Strategy List)</h2><p style="color:#666;font-size:13px">来源：App 内 Strategy List 的 6 个 Google Slides（已完整抓取）</p><div class="grid">';
  STRATS.forEach(([en,zh,desc,api])=>{
    h+=`<div class="card" style="text-align:left"><h3 style="margin:0 0 6px;color:#0e6e7d">${en} · ${zh}</h3><p style="font-size:12px;color:#444;line-height:1.5">${desc}</p><small style="color:#888">接口: <code>${api}</code></small></div>`;
  });
  h+='</div>';
  el.innerHTML=h;
}

// ===== 标签页 =====
const tabs = [["p-stock","个股"],["p-market","行情/榜"],["p-hot","热门"],["p-index","指数"],["p-news","新闻"],["p-screener","选股"],["p-strategy","策略"],["p-chart","图表"]];
const tb = document.getElementById('tabs');
tabs.forEach(([id,label],i)=>{
  const b=document.createElement('button'); b.textContent=label; if(i===0)b.className='active';
  b.onclick=()=>{document.querySelectorAll('.tabs button').forEach(x=>x.className='');b.className='active';document.querySelectorAll('.panel').forEach(p=>p.classList.remove('active'));document.getElementById(id).classList.add('active'); if(id==='p-strategy') renderStrategy();};
  tb.appendChild(b);
});
document.getElementById('p-stock').classList.add('active');

// ===== 个股 =====
let CUR={};
async function loadStock(){
  const code=document.getElementById('stock-code').value.trim();
  const el=document.getElementById('stock-body'); el.className='loading'; el.textContent='加载中…';
  try{
    const u=shUrl("http://freeinfo.my/api/klse/getcurresult_v1.php","req_date="+today());
    const d=await getJSON(u); const r=arr(d)[0]||{}; CUR=r;
    document.getElementById('stock-name').textContent=r.stockname||code;
    el.className=''; el.innerHTML=`<div class="card">
      <b>现价</b> ${r.price||r.pri_now||'-'} <span>${pct(r.pri_chg)} ${r.pri_chg_pcn||''}%</span><br>
      Bid/Ask: ${r.pri_bid||'-'} / ${r.pri_ask||'-'} · 量: ${r.volumn||r.vol_now||'-'}<br>
      年高/低: ${r.pri_year_high||'-'} / ${r.pri_year_low||'-'} · 200/20ma: ${r.pri_ma200||'-'} / ${r.pri_ma20||'-'}
    </div>`;
  }catch(e){ el.textContent='错误: '+e; }
}
async function loadFundamental(){ const el=document.getElementById('stock-body'); el.className='loading'; el.textContent='加载中…';
  try{ const u=shUrl("http://freeinfo.my/api/klse/getklsediv_bycode_v1.php","StkCode="+CUR.stockcode); const d=await getJSON(u);
    el.className=''; el.innerHTML=`<div class="card"><b>FUNDAMENTAL</b><br>PE: ${CUR.pe||'-'} · ROE: ${CUR.roe||'-'}% · EV/EBIT: ${CUR.EV_EBIT||'-'} · 股息率: ${CUR.dy||'-'}%<br>市净率: ${CUR.pri_of_book||'-'} · 流动比: ${CUR.current_ratio||'-'} · 净现金: ${CUR.net_cash||'-'} · 债务现金比: ${CUR.debt_cash||'-'}<br>股息(DPS): ${CUR.dps||'-'} · NTA: ${CUR.nta||'-'} · 市值: ${CUR.market_cap||'-'}</div>`+(d.result_value?('<div class="card">'+JSON.stringify(d.result_value).slice(0,300)+'</div>'):'');
  }catch(e){ el.textContent='错误: '+e; }
}
async function loadTechnical(){ const el=document.getElementById('stock-body'); el.className='';
  el.innerHTML=`<div class="card"><b>TECHNICAL</b><br>MACD: ${CUR.macd||'-'} (signal ${CUR.macd_signal||'-'}) · RSI: ${CUR.rsi||'-'} · OBV: ${CUR.obv||'-'} ${CUR.obv_sid||''}<br>布林带: ${CUR.pri_bb_up||'-'}~${CUR.pri_bb_down||'-'} · 金叉: ${CUR.ema_golden_cross||'-'} · 动量: ${CUR.mom_strength||'-'}<br>形态: ${CUR.candle_desc||'-'}</div>`;
}
async function loadQResult(){ const el=document.getElementById('stock-body'); el.className='loading'; el.textContent='加载中…';
  try{ const u=shUrl("http://www.freeinfo.my/api/klse/getklseprospect_bycode_v1.php","stk_code="+CUR.stockcode+"&q_year=&PostId=&KeywId=&req_date="+today()+"&os=and");
    const d=await getJSON(u); const r=arr(d)[0]||{};
    el.className=''; el.innerHTML=`<div class="card"><b>Q-RESULT</b><br>${JSON.stringify(r).slice(0,400)}</div>`;
  }catch(e){ el.textContent='错误: '+e; }
}
async function loadDividend(){ const el=document.getElementById('stock-body'); el.className='loading'; el.textContent='加载中…';
  try{ const u=shUrl("http://www.freeinfo.my/api/klse/getklsediv_bycode_v1.php","StkCode="+CUR.stockcode+"&req_date="+today());
    const d=await getJSON(u); const rs=arr(d);
    let h='<div class="card"><b>DIVIDEND</b><table><tr><th>FY</th><th>DPS</th><th>Ex</th><th>Pay</th><th>公告</th></tr>';
    rs.slice(0,10).forEach(x=>h+=`<tr><td>${x.fy||x.financial_year||''}</td><td>${x.dps||x.dividend||''}</td><td>${x.ex_date||''}</td><td>${x.pay_date||''}</td><td>${x.announced||''}</td></tr>`);
    h+='</table></div>'; el.className=''; el.innerHTML=h||'(无股息)';
  }catch(e){ el.textContent='错误: '+e; }
}
async function loadWarrant(){ const el=document.getElementById('stock-body'); el.className='loading'; el.textContent='加载中…';
  try{ const u="http://www.klsestock.com/json_cache_v2.php?id=38&code="+CUR.stockcode; const d=await getJSON(u);
    let h='<div class="card"><b>WARRANT</b><table><tr><th>代码</th><th>名</th><th>价</th><th>涨跌%</th><th>量</th></tr>';
    arr(d).slice(0,30).forEach(w=>h+=`<tr><td>${w.code||w.stk_code||''}</td><td>${w.name||w.stockname||''}</td><td>${w.price||w.pri_now||''}</td><td>${pct(w.chg_pct)}</td><td>${w.volume||''}</td></tr>`);
    h+='</table></div>'; el.className=''; el.innerHTML=h||'(无权证)';
  }catch(e){ el.textContent='错误: '+e; }
}
async function loadStockNews(){ const el=document.getElementById('stock-body'); el.className='loading'; el.textContent='加载中…';
  try{ const u=shUrl("http://www.freeinfo.my/api/klse/getklsenews_bycode_v2.php","StkCode="+CUR.stockcode+"&PostId=&Cat=&Lang=1&keywId="+CUR.stockcode+"&req_date="+today());
    const d=await getJSON(u); let h=''; arr(d).slice(0,15).forEach(n=>h+=`<div class="card"><b>${n.title||''}</b><br><small>${n.date||n.time||''}</small><br>${n.desc||n.summary||''}</div>`);
    el.className=''; el.innerHTML=h||'(无新闻)';
  }catch(e){ el.textContent='错误: '+e; }
}
async function loadAdam(){ const code=CUR.stockcode||document.getElementById('stock-code').value;
  document.getElementById('chart-type').value='adam'; document.getElementById('chart-code').value=code; loadChart();
}

// ===== 行情/榜单 (json_cache) =====
async function cacheList(id,title){ const el=document.getElementById('market-body'); el.className='loading'; el.textContent='加载中… ('+title+')';
  try{ const v = ['3','26','27','28','29'].includes(id)?'v2':'v1'; const u="http://www.klsestock.com/json_cache_"+v+".php?id="+id;
    const d=await getJSON(u); let h=`<div class="card"><b>${title}</b></div><table><tr><th>代码</th><th>名</th><th>价</th><th>涨跌%</th><th>量</th><th>PE</th><th>DY</th><th>ROE</th></tr>`;
    arr(d).slice(0,50).forEach(r=>h+=`<tr><td>${r.stk_code||r.code||''}</td><td>${r.stockname||r.name||''}</td><td>${r.price||r.pri_now||''}</td><td>${pct(r.chg_pct||r.pri_chg_pcn)}</td><td>${r.volume||r.volumn||''}</td><td>${r.pe||''}</td><td>${r.dy||''}</td><td>${r.roe||''}</td></tr>`);
    h+='</table>'; el.className=''; el.innerHTML=h;
  }catch(e){ el.textContent='错误: '+e; }
}

// ===== 新闻 =====
async function loadNews(){ const k=document.getElementById('news-kind').value, s=document.getElementById('news-stk').value; const el=document.getElementById('news-body'); el.className='loading'; el.textContent='加载中…';
  try{ const base = k==='social' ? "http://freeinfo.my/api/klse/getklse_social_v1.php" : "http://www.freeinfo.my/api/klse/getklsenews_bycode_v2.php";
    const p = `StkCode=${s}&PostId=&Cat=&Lang=1${k==='social'?'':'&keywId='}&req_date=${today()}`;
    const data=await getJSON(shUrl(base,p,true)); let h='';
    arr(data).slice(0,40).forEach(n=>{ h+=`<div class="card"><b>${n.title||n.headline||'(无标题)'}</b><br><small>${n.date||n.time||''} · ${n.source||''}</small><br>${n.summary||n.desc||''}</div>`; });
    el.className=''; el.innerHTML=h||'(无结果)';
  }catch(e){ el.textContent='错误: '+e; }
}

// ===== 选股 (完整 SA/FA/TA/CA 四层) =====
async function loadScreener(){
  const el=document.getElementById('screener-body'); el.className='loading'; el.textContent='加载中…';
  const g=v=>document.getElementById(v).checked?'1':'';
  const val=v=>document.getElementById(v).value;
  // SA
  const sa=`bo=${g('f-bo')}&yh=${g('f-yh')}&tp=${g('f-tp')}&gw=${g('f-gw')}&nc=${g('f-nc')}&iw=${g('f-iw')}&tr=${g('f-tr')}&hl=${g('f-hl')}&er=${g('f-er')}`;
  const sa2=`type=${val('f-report')}&trend=${val('f-trend')}&day=${val('f-trendday')}&sector=${val('f-sector')}&pri_mi=${val('f-pmin')}&pri_mx=${val('f-pmax')}`;
  // FA
  const fa=`pe=${val('f-pe')}&pm=${val('f-pm')}&ev=${val('f-ev')}&dc=${val('f-dc')}&cr=${val('f-cr')}&ey=${val('f-ey')}&roe=${val('f-roe')}&dy=${val('f-dy')}&pob=${val('f-pob')}&evalue_ab=${val('f-evalue')}&m_cap_min=${val('f-mcapmin')}&m_cap_max=${val('f-mcapmax')}&t_share_min=${val('f-tsmin')}&t_share_max=${val('f-tsmax')}`;
  // TA
  const ta=`ma1=${val('f-ma1')}&ma_c1=${val('f-mac1')}&ma2=${val('f-ma2')}&ma_c2=${val('f-mac2')}&ma3=${val('f-ma3')}&macd=${val('f-macd')}&macd_day=${val('f-macdday')}&rsi_c=${val('f-rsic')}&rsi_v=${val('f-rsiv')}&obv=${val('f-obv')}&bb=${val('f-bb')}&bb_day=${val('f-bbday')}&turn_ov_min=${val('f-tomin')}&turn_ov_max=${val('f-tomax')}`;
  // CA (19 形态)
  const caOpts=['hammer','harami','haramicross','engulfing','piercing','dojistar','dragonflydoji','marubozu','invertedhammer','takuri','morningstar','morningdojistar','tristar','kicking','tasukigap','abandonbaby','threelinestrike','threeoutside','threewhitesoldiers'];
  const ca=caOpts.map(c=>`${c}=${g('f-ca-'+c)}`).join('&');
  const p=`id=20&${sa}&${sa2}&${fa}&${ta}&${ca}&ver=3.7.1&sn=own`;
  try{ const u="http://www.klsestock.com/json_filter_v1.php?"+encodeURIComponent("hash="+aesEncrypt(p))+"&os=and";
    const d=await getJSON(u); let h='<table><tr><th>代码</th><th>名</th><th>价</th><th>PE</th><th>ROE</th><th>DY</th><th>MACD</th><th>RSI</th></tr>';
    arr(d).slice(0,80).forEach(r=>{ h+=`<tr><td>${r.stockcode||''}</td><td>${r.stockname||''}</td><td>${r.price||''}</td><td>${r.pe||''}</td><td>${r.roe||''}</td><td>${r.dy||''}</td><td>${r.macd||''}</td><td>${r.rsi||''}</td></tr>`; });
    h+='</table>'; el.className=''; el.innerHTML=h||'(无结果)';
  }catch(e){ el.textContent='错误: '+e; }
}

// ===== 图表 =====
async function loadChart(){ const t=document.getElementById('chart-type').value, code=document.getElementById('chart-code').value; const el=document.getElementById('chart-body');
  let u,enc=true,base,params;
  if(t==='adam'){ base="http://www.stockhunter.my/api/klse/get_chart_adam.php"; params="StkCode="+code+"&req_date="+today(); }
  else if(t==='mom'){ base="http://www.stockhunter.my/api/klse/get_chart_mom_subsector.php"; params="req_date="+today(); }
  else { base="http://www.freeinfo.my/api/klse/get_chart_happypanic.php"; params="req_date="+today(); }
  const target=base+"?"+(enc?("hash="+encodeURIComponent(aesEncrypt(params))+"&os=and"):params);
  document.getElementById('chart-iframe').src=PROXY+encodeURIComponent(target);
}
